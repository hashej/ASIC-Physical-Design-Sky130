DESIGN_NAME: spm
VERILOG_FILES: dir::src/*.v
PNR_SDC_FILE: dir::src/impl.sdc
SIGNOFF_SDC_FILE: dir::src/signoff.sdc

# Clock configuration (Combinational design)
CLOCK_PERIOD: 0
CLOCK_PORT: null
DESIGN_IS_CORE: true

# PDN Configuration
PDN_CORE_RING: true
PDN_ENABLE_RAILS: true
PDN_HORIZONTAL_LAYER: met5
PDN_VERTICAL_LAYER: met4
PDN_HWIDTH: 3.1
PDN_VWIDTH: 3.1
PDN_HPITCH: 120
PDN_VPITCH: 120
PDN_HOFFSET: 16.32
PDN_VOFFSET: 16.32

# Pin Ordering
IO_PIN_ORDER_CFG: dir::pin_order.cfg

# Technology Configuration
pdk::sky130*:
  FP_SIZING: "absolute"
  DIE_AREA: [0, 0, 500, 500]
  CORE_AREA: [20, 20, 480, 480]
  FP_CORE_UTIL: 45

  # Placement Variables
  PL_TARGET_DENSITY: 0.50
  PL_TIME_DRIVEN: false
  PL_ROUTABILITY_DRIVEN: true
  PL_RESIZER_TIMING_OPTIMIZATION: false
  GPL_CELL_PADDING: 1
  DPL_CELL_PADDING: 1
